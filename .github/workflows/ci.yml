name: Orion CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  ORION_ENV: test
  ORION_ENABLE_DEV_IDP: "true"
  ORION_TOKEN_SIGNING_KEY: orion-ci-signing-key-not-for-production

jobs:
  test-and-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.12"

      - name: Assert Dockerfile digests are pinned
        run: python scripts/assert_dockerfile_digests.py

      - name: Validate compose configs
        env:
          ORION_TOKEN_SIGNING_KEY: orion-ci-compose-config-key
        run: |
          docker compose --profile prod config >/dev/null
          docker compose --profile dev config >/dev/null

      - name: Install dependencies from hashed lockfile
        run: |
          python -m pip install --upgrade "pip==26.3" "setuptools==80.9.0" "wheel==0.45.1"
          python -m pip install --require-hashes -r requirements.txt
          python -m pip install --no-deps -e .

      - name: Install dev tools without breaking hash install
        run: |
          python -m pip install "pytest>=9.0.3,<10.0" "httpx>=0.27,<1.0" "ruff>=0.6,<1.0" "bandit>=1.7,<2.0" "pip-audit>=2.7,<3.0"

      - name: Unit, security, and evaluation tests
        run: pytest

      - name: Ruff lint
        run: ruff check app tests evals scripts

      - name: Bandit SAST
        run: bandit -r app -ll -q

      - name: Dependency audit
        run: pip-audit -r requirements.txt

      - name: Hadolint Dockerfile
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: Dockerfile
          failure-threshold: warning

      - name: Gitleaks secret scan
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@915b19bbe73b92a6cf82a1bc12b087c9a19a5fe2 # v0.28.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true

      - name: Checkov IaC scan
        uses: bridgecrewio/checkov-action@d066f88499d847b08c3f0ab0348978146d74bb0c # v12.2955.0
        with:
          directory: .
          framework: dockerfile,compose
          soft_fail: false
          output_format: cli

      - name: Generate SBOM with Syft
        uses: anchore/sbom-action@df80a981bc6edbc4e220a492d3cbe9f5547a6e75 # v0.17.9
        with:
          path: .
          format: spdx-json
          output-file: sbom.spdx.json

      - name: Upload SBOM
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: orion-sbom
          path: sbom.spdx.json
